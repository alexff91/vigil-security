[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-security"
version = "0.1.0"
description = "Open-source personal security agent — monitors infrastructure, scans dependencies, detects secrets, alerts via Telegram."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aleksandr Fedorov", email = "alexff91@users.noreply.github.com"},
]
keywords = ["security", "monitoring", "vulnerability", "scanner", "devops", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "aioresponses>=0.7",
    "ruff>=0.3.0",
    "mypy>=1.8",
]

[project.scripts]
vigil = "vigil.cli:main"

[project.urls]
Homepage = "https://github.com/alexff91/vigil-security"
Repository = "https://github.com/alexff91/vigil-security"
Issues = "https://github.com/alexff91/vigil-security/issues"

[tool.setuptools.packages.find]
include = ["vigil*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
